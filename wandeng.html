<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚灯沉痕 - 个人主页</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{background:#f5f6f7;color:#333;font-size:14px;line-height:1.6;max-width:720px;margin:0 auto;padding:12px;}
.profile-card{background:#fff;border:1px solid #ddd;padding:14px;margin-bottom:10px;}
.head-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;}
.username{font-size:16px;font-weight:bold;color:#333;}
.sign{font-size:12px;color:#888;margin-bottom:12px;}
.stats{font-size:12px;color:#999;margin-bottom:14px;}
.dynamic-list{background:#fff;border:1px solid #ddd;}
.dynamic-item{padding:12px;border-bottom:1px solid #eee;}
.dynamic-item:last-child{border-bottom:none;}
.dyn-time{font-size:12px;color:#999;margin-bottom:4px;}
.diary-img{width:100%;max-width:520px;display:block;margin-top:8px;border:1px solid #ddd;cursor:pointer;}
.caption{font-size:12px;color:#999;margin-top:6px;}
.back-link{margin-top:12px;font-size:12px;}
.back-link a{color:#0066cc;text-decoration:none;}
.back-link a:hover{text-decoration:underline;}

/* 原生点击放大弹窗 */
.img-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);justify-content:center;align-items:center;z-index:99;}
.img-modal.show{display:flex;}
.img-modal img{max-width:92vw;max-height:92vh;object-fit:contain;}
.close-btn{position:absolute;top:14px;right:18px;color:#fff;font-size:28px;cursor:pointer;user-select:none;}
</style>
</head>
<body>

<div class="profile-card">
  <div class="head-row">
    <img class="avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=wandeng" alt="头像">
    <div>
      <div class="username">晚灯沉痕</div>
      <div class="sign">痕迹不会自己消失</div>
    </div>
  </div>
  <div class="stats">粉丝：31｜关注：9｜发帖：7</div>
</div>

<div class="dynamic-list">
  <div class="dynamic-item">
    <div class="dyn-time">2022‑03‑10 19:42</div>
    <div>仪式要走七步，顺序要看裂纹延伸的方向。屏障不能放中间。</div>
  </div>

  <div class="dynamic-item">
    <div class="dyn-time">2022‑03‑13 21:08</div>
    <div>
      昨天整理旧物，翻到一本本子。有些字写得很急，像是怕来不及。
      <img class="diary-img" id="diaryImg" src="assets/diary_zhouyan.jpg" alt="日记本局部照片">
      <div class="caption">点击图片放大查看</div>
    </div>
  </div>

  <div class="dynamic-item">
    <div class="dyn-time">2022‑03‑14 01:33</div>
    <div>我不是故意要记住这些。只是有些痕迹，一旦被看见，就很难再合上。</div>
  </div>
</div>

<div class="back-link">
  <a href="../bait_thread.html">← 返回帖子</a>
</div>

<!-- 图片放大弹窗 -->
<div class="img-modal" id="imgModal">
  <span class="close-btn" id="closeBtn">×</span>
  <img id="modalImg" src="" alt="放大查看">
</div>

<script>
const img = document.getElementById('diaryImg');
const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
const closeBtn = document.getElementById('closeBtn');

img.addEventListener('click', () => {
  modalImg.src = img.src;
  modal.classList.add('show');
});

closeBtn.addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('show');
});
</script>

</body>
</html>
