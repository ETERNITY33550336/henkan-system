<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>痕勘系统 · 档案｜★绝密</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Consolas",monospace;}
body{background:#0b0f16;color:#c5cfdd;padding:24px;max-width:800px;margin:0 auto;}
.back{color:#88a0bf;text-decoration:none;margin-bottom:20px;display:inline-block;}
.card{background:#131a24;border:1px solid #27303f;padding:22px;}
.line{margin:12px 0;font-size:15px;}
.label{color:#94a3b8;}
.cover{display:inline-block;background:#fff;color:transparent;padding:0 8px;min-width:180px;user-select:none;}
.note-wrap{margin-top:20px;font-size:12px;color:#5a6e88;text-align:center;}
.morse-line{margin-top:8px;letter-spacing:6px;color:#7088a5;user-select:text;}

/* —— 低可见隐写密文区 —— */
.hidden-area{
  margin:30px 0 10px;
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  user-select:text;
  cursor:text;
}
.hidden-cipher{
  font-family:"Consolas",monospace;
  font-size:28px;
  letter-spacing:2px;
  color:#0c121c;
  background:transparent;
  user-select:text;
  cursor:text;
  padding:10px 14px;
  border-radius:4px;
  transition:color 0.25s ease, background 0.25s ease;
}
.hidden-cipher:hover{
  color:#142033;
  background:rgba(255,255,255,0.02);
}
</style>
</head>
<body>
<a class="back" href="./dashboard.html">← 返回控制台</a>
<div class="card">
  <div class="line"><span class="label">档案编号：</span><span id="f-id"></span></div>
  <div class="line"><span class="label">姓名：</span><span id="f-name"></span></div>
  <div class="line"><span class="label">性别：</span><span id="f-gender"></span></div>
  <div class="line"><span class="label">年龄：</span><span id="f-age"></span></div>
  <div class="line"><span class="label">权限等级：</span><span id="f-level"></span></div>
  <div class="line"><span class="label">任职方向：</span><span id="f-duty"></span></div>
  <div class="line"><span class="label">备注标记：</span><span id="f-note"></span></div>
</div>

<div class="note-wrap">
  绝密人事档案终端
  <div class="morse-line">−−−−− ··−−− ·−−−− −−−−− ··−−− −−−−·</div>
</div>

<div class="hidden-area">
  <span class="hidden-cipher" id="hiddenCipher"></span>
</div>

<script>
const data = {
  id:"SK‑000‑ROOT",
  name:"沈逾白",
  gender:"保密",
  age:"23（档案登记生日：2002‑10‑29）",
  level:"S（宿主）",
  duty:"痕勘系统总调度、项目最高权限",
  note:"存在未归档异常记录，访问严格受限"
};

function getPerm(){
  try{
    const auth = JSON.parse(localStorage.getItem("henkan_auth"));
    return auth?.level||"none";
  }catch(e){return "none";}
}

// 凯撒右移7（加密）
function caesarRight7(s){
  return s.split("").map(c=>{
    if(/[A-Za-z0-9]/.test(c)){
      const code=c.charCodeAt(0);
      if(code>=48&&code<=57) return String.fromCharCode(48+((code-48+7)%10));
      if(code>=65&&code<=90) return String.fromCharCode(65+((code-65+7)%26));
      if(code>=97&&code<=122) return String.fromCharCode(97+((code-97+7)%26));
    }
    return c;
  }).join("");
}
// 凯撒左移7（解密，测试用）
function caesarLeft7(s){
  return s.split("").map(c=>{
    if(/[A-Za-z0-9]/.test(c)){
      const code=c.charCodeAt(0);
      if(code>=48&&code<=57) return String.fromCharCode(48+((code-48-7+10)%10));
      if(code>=65&&code<=90) return String.fromCharCode(65+((code-65-7+26)%26));
      if(code>=97&&code<=122) return String.fromCharCode(97+((code-97-7+26)%26));
    }
    return c;
  }).join("");
}

function b64ThenCaesar7(plainText){
  const b64=btoa(unescape(encodeURIComponent(plainText)));
  return caesarRight7(b64);
}
// 解密反向函数（你测试用）
function caesar7ThenB64Decode(cipher){
  const step1=caesarLeft7(cipher);
  return decodeURIComponent(escape(atob(step1)));
}

const p = getPerm();
const isLock = p !== "S";

document.getElementById("f-id").innerHTML = isLock ? `<span class="cover">███████</span>` : data.id;
document.getElementById("f-name").innerHTML = isLock ? `<span class="cover">██████</span>` : data.name;
document.getElementById("f-gender").innerHTML = isLock ? `<span class="cover">████</span>` : data.gender;
document.getElementById("f-age").innerHTML = isLock ? `<span class="cover">████</span>` : data.age;
document.getElementById("f-level").innerHTML = isLock ? `<span class="cover">███████</span>` : data.level;
document.getElementById("f-duty").innerHTML = isLock ? `<span class="cover">████████████████</span>` : data.duty;
document.getElementById("f-note").innerHTML = isLock ? `<span class="cover">██████████████████████</span>` : data.note;

// ✅ 测试占位链接（之后只改这一行就行！）
const SECRET_LINK = "https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3";
const cipherText = b64ThenCaesar7(SECRET_LINK);
document.getElementById("hiddenCipher").textContent = cipherText;

// 👉 你可以F12控制台输入：caesar7ThenB64Decode(cipherText) 直接验证解密结果
window.cipherText = cipherText;
window.caesar7ThenB64Decode = caesar7ThenB64Decode;
</script>
</body>
</html>
